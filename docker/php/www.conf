[global]
daemonize = no
error_log = /proc/self/fd/2
log_limit = 8192

[www]
user = www-data
group = www-data
listen = 9000
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 25
pm.start_servers = 5
pm.min_spare_servers = 3
pm.max_spare_servers = 10
pm.max_requests = 1000

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
